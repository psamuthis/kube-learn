#>>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lister
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: list-pods
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lister-list-pods
subjects:
  - kind: ServiceAccount
    name: lister
    namespace: ex-12-3
roleRef:
  kind: Role
  name: list-pods
  apiGroup: rbac.authorization.k8s.io
