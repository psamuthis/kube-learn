apiVersion: batch/v1
kind: Job
metadata:
  name: report
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      #>>
      #| containers:
      #|   - name: main
      #|     image: busybox:1.37
      #|     command: ["sh", "-c", "for i in 1 2 3 4 5; do echo \"line $i\" >> /logs/app.log; sleep 1; done"]
      #|     volumeMounts: [{name: logs, mountPath: /logs}]
      #|   - name: shipper
      #|     image: busybox:1.37
      #|     command: ["sh", "-c", "touch /logs/app.log; tail -F /logs/app.log"]
      #|     volumeMounts: [{name: logs, mountPath: /logs}]
      initContainers:
        - name: shipper
          image: busybox:1.37
          restartPolicy: Always
          command: ["sh", "-c", "touch /logs/app.log; tail -F /logs/app.log"]
          volumeMounts: [{name: logs, mountPath: /logs}]
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", "for i in 1 2 3 4 5; do echo \"line $i\" >> /logs/app.log; sleep 1; done"]
          volumeMounts: [{name: logs, mountPath: /logs}]
      #<<
      volumes:
        - name: logs
          emptyDir: {}
