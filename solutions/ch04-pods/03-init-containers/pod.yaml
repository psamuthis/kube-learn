apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  #>>
  #| # TODO: initContainers
  initContainers:
    - name: wait-for-db
      image: busybox:1.37
      command: ["sh", "-c", "until nslookup db.ex-4-3.svc.cluster.local; do echo waiting for db; sleep 2; done"]
    - name: render-config
      image: busybox:1.37
      command: ["sh", "-c", "echo database=db.ex-4-3.svc.cluster.local > /config/settings.txt"]
      volumeMounts:
        - name: config
          mountPath: /config
  #<<
  containers:
    - name: kubeapp
      image: kubeapp:1.0
      #>>
      #| # TODO: mount the config volume at /config
      volumeMounts:
        - name: config
          mountPath: /config
      #<<
  #>>
  #| # TODO: volumes
  volumes:
    - name: config
      emptyDir: {}
  #<<
