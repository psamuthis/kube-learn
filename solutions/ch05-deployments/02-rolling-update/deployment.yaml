apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  #>>
  #| # TODO: change-cause annotation
  annotations:
    kubernetes.io/change-cause: upgrade to 2.0
  #<<
spec:
  replicas: 3
  #>>
  #| # TODO: strategy and minReadySeconds
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  #<<
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          #>>
          #| image: kubeapp:1.0
          image: kubeapp:2.0
          #<<
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 1
          resources:
            requests: {cpu: 20m, memory: 32Mi}
