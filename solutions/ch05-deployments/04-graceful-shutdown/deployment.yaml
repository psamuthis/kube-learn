apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      #>>
      #| # TODO: grace period
      terminationGracePeriodSeconds: 20
      #<<
      containers:
        - name: app
          image: kubeapp:1.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 1}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          #>>
          #| # TODO: env and lifecycle
          env:
            - name: SHUTDOWN_DELAY
              value: "3"
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          #<<
