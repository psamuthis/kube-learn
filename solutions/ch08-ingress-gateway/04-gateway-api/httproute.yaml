apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: public
  hostnames: [shop.ex84.kube-learn.test]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: shop, port: 80, weight: 90}
        - {name: shop-v2, port: 80, weight: 10}
    - matches:
        - headers:
            - {name: x-beta, value: "1"}
      backendRefs:
        - {name: shop-v2, port: 80}
