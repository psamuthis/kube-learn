apiVersion: apps/v1
kind: Deployment
metadata:
  name: sized
spec:
  replicas: 2
  selector:
    matchLabels: {app: sized}
  template:
    metadata:
      labels: {app: sized}
    spec:
      containers:
        - name: app
          image: kubeapp:1.0
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 2}
          resources:
            #>>
            #| requests: {cpu: 500m, memory: 1Gi}
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
            #<<
