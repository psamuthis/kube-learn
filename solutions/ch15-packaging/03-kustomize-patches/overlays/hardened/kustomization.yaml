kind: Kustomization
resources:
  - ../../base
patches:
  - path: resources-patch.yaml
  - target:
      kind: Deployment
      name: shop
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: HARDENED
            value: "true"
