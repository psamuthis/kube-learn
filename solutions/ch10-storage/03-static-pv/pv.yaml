apiVersion: v1
kind: PersistentVolume
metadata:
  name: archive-ex103
spec:
  capacity:
    storage: 200Mi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /data/archive-ex103
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [kube-learn-m03]
