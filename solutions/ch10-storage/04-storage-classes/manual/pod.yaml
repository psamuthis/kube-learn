apiVersion: v1
kind: Pod
metadata:
  name: user
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "date > /data/created; sleep infinity"]
      volumeMounts: [{name: data, mountPath: /data}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: probe}
