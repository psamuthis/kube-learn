apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop}
  template:
    metadata:
      labels: {app: shop}
    spec:
      containers:
        - name: app
          image: kubeapp:1.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 2}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          #>>
          #| # TODO: volumeMounts
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          #<<
      #>>
      #| # TODO: volumes
      volumes:
        - name: config
          configMap:
            name: files
            items:
              - key: app.properties
                path: settings/application.properties
              - key: motd.txt
                path: motd
      #<<
