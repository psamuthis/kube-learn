apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop}
  template:
    metadata:
      labels: {app: shop}
    spec:
      #>>
      #| # TODO: securityContext, volumes
      securityContext:
        fsGroup: 10001
      volumes:
        - name: creds
          secret:
            secretName: db-credentials
            defaultMode: 0440
      #<<
      containers:
        - name: app
          image: kubeapp:1.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 2}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          #>>
          #| # TODO: env, volumeMounts
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
          volumeMounts:
            - name: creds
              mountPath: /secrets
              readOnly: true
          #<<
