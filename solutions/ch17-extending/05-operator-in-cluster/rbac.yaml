apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kv-operator
rules:
  - apiGroups: [kube-learn.dev]
    resources: [keyvaluestores]
    verbs: [get, list, watch]
  - apiGroups: [kube-learn.dev]
    resources: [keyvaluestores/status]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kv-operator
subjects:
  - kind: ServiceAccount
    name: kv-operator
    namespace: ex-17-5
roleRef:
  kind: Role
  name: kv-operator
  apiGroup: rbac.authorization.k8s.io
