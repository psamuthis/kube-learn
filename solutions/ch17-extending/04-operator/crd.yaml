apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keyvaluestores.kube-learn.dev
spec:
  group: kube-learn.dev
  scope: Namespaced
  names:
    kind: KeyValueStore
    plural: keyvaluestores
    singular: keyvaluestore
    shortNames: [kvs]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.readyReplicas
      additionalPrinterColumns:
        - {name: Replicas, type: integer, jsonPath: .spec.replicas}
        - {name: Ready, type: integer, jsonPath: .status.readyReplicas}
        - {name: Version, type: string, jsonPath: .spec.version}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [version]
              properties:
                replicas: {type: integer, minimum: 1, maximum: 5, default: 1}
                version: {type: string, enum: ["7.4", "8.0"]}
            status:
              type: object
              properties:
                phase: {type: string}
                readyReplicas: {type: integer}
                observedGeneration: {type: integer}
