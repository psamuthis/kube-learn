#>>
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: notes.kube-learn.dev
spec:
  group: kube-learn.dev
  scope: Namespaced
  names:
    kind: Note
    plural: notes
    singular: note
    shortNames: [nt]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Text, type: string, jsonPath: .spec.text}
        - {name: Priority, type: integer, jsonPath: .spec.priority}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 280
                priority:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
                tags:
                  type: array
                  items: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
#<<
