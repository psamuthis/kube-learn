apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast
spec:
  replicas: 3
  selector:
    matchLabels: {app: fast}
  template:
    metadata:
      labels: {app: fast}
    spec:
      #>>
      #| # TODO: nodeSelector
      nodeSelector:
        disktype: ssd
      #<<
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 5m, memory: 8Mi}}
