#>>
apiVersion: batch/v1
kind: Job
metadata:
  name: crunch
spec:
  completions: 6
  parallelism: 2
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: busybox:1.37
          command: ["sh", "-c", "echo \"crunching on $(hostname)\"; sleep 2"]
#<<
