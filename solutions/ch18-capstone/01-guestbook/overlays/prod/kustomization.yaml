#>>
#| apiVersion: kustomize.config.k8s.io/v1beta1
#| kind: Kustomization
#| resources:
#|   - ../../base
#| # TODO: the Ingress, prod image and sizing
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
labels:
  - pairs: {env: prod}
images:
  - name: kubeapp
    newTag: "2.0"
patches:
  - target: {kind: Deployment, name: web}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
#<<
