apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api, tier: backend}
  template:
    metadata:
      labels: {app: api, tier: backend}
    spec:
      containers:
        - name: app
          image: kubeapp:1.0
          env: [{name: MESSAGE, value: "api is up"}]
          ports: [{name: web, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: web}, periodSeconds: 2}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    #>>
    #| app: api-server
    app: api
    #<<
    tier: backend
  ports:
    - port: 80
      #>>
      #| targetPort: 80
      targetPort: web
      #<<
