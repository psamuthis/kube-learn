apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened
spec:
  replicas: 1
  selector:
    matchLabels: {app: hardened}
  template:
    metadata:
      labels: {app: hardened}
    spec:
      securityContext: {}
      containers:
        - name: app
          image: kubeapp:1.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 2}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
          securityContext:
            privileged: true
