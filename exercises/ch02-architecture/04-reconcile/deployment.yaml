apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: kubeapp
          image: kubeapp:1.0
          resources:
            requests: {cpu: 10m, memory: 32Mi}
