apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami, team: platform}
    spec:
      containers:
        - name: app
          image: kubeapp:1.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 2}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
          # TODO: env and volumeMounts
      # TODO: volumes
